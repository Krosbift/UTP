spring:
  application:
    name: santiago

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      pool-name: HikariPool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
  aop:
    proxy-target-class: false